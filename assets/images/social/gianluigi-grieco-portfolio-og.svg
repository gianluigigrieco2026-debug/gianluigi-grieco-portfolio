<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Portfolio di Gianluigi Grieco</title>
  <desc id="description">Graphic Designer e Web Designer</desc>

  <defs>
    <radialGradient id="blue" cx="0" cy="0" r="1" gradientTransform="translate(940 145) rotate(135) scale(480 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#004CFF" stop-opacity=".65"/>
      <stop offset="1" stop-color="#004CFF" stop-opacity="0"/>
