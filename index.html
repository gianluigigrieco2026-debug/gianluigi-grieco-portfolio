<!DOCTYPE html>
<html lang="it" data-color-theme="original">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gianluigi Grieco — Graphic Designer &amp; Web Designer</title>

    <meta
        name="description"
        content="Portfolio di Gianluigi Grieco, Graphic Designer e Web Designer. Brand identity, graphic design e siti web progettati per essere chiari, riconoscibili e funzionali."
    >

    <meta
        name="author"
        content="Gianluigi Grieco"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta name="robots" content="index, follow, max-image-preview:large">

    <!-- Aggiornare questo URL, robots.txt e sitemap.xml quando verrà collegato il dominio personale. -->
    <link
        rel="canonical"
        href="https://gianluigigrieco2026-debug.github.io/gianluigi-grieco-portfolio/"
    >

    <link
        rel="icon"
        href="assets/icons/favicon.svg"
        type="image/svg+xml"
    >

    <meta property="og:type" content="website">
    <meta property="og:locale" content="it_IT">
    <meta property="og:site_name" content="Gianluigi Grieco — Portfolio">
    <meta property="og:title" content="Gianluigi Grieco — Graphic Designer &amp; Web Designer">
    <meta property="og:description" content="Brand identity, graphic design e siti web progettati per essere chiari, riconoscibili e funzionali.">
    <meta property="og:url" content="https://gianluigigrieco2026-debug.github.io/gianluigi-grieco-portfolio/">
    <meta property="og:image" content="https://gianluigigrieco2026-debug.github.io/gianluigi-grieco-portfolio/assets/images/social/gianluigi-grieco-portfolio-og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Portfolio di Gianluigi Grieco, Graphic Designer e Web Designer">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gianluigi Grieco — Graphic Designer &amp; Web Designer">
    <meta name="twitter:description" content="Brand identity, graphic design e siti web progettati per essere chiari, riconoscibili e funzionali.">
    <meta name="twitter:image" content="https://gianluigigrieco2026-debug.github.io/gianluigi-grieco-portfolio/assets/images/social/gianluigi-grieco-portfolio-og.png">
    <meta name="twitter:image:alt" content="Portfolio di Gianluigi Grieco, Graphic Designer e Web Designer">

    <script>
        (() => {
            try {
                const savedTheme = localStorage.getItem("portfolio-color-theme");
                const isSignalTheme = savedTheme === "signal" || savedTheme === "acid";
                document.documentElement.dataset.colorTheme =
                    isSignalTheme ? "signal" : "original";
                document.querySelector('meta[name="theme-color"]').content =
                    isSignalTheme ? "#05070a" : "#020307";
            }
            catch {
                document.documentElement.dataset.colorTheme = "original";
                document.querySelector('meta[name="theme-color"]').content = "#020307";
            }
        })();
    </script>

    <link
        rel="stylesheet"
        href="css/app.css"
    >
</head>

<body>

    <div
        class="site-loader"
        id="siteLoader"
        role="status"
        aria-label="Caricamento del portfolio"
    >
        <div class="site-loader__signature" aria-hidden="true">
            <div class="site-loader__signature-reveal">
                <img src="assets/icons/loader-signature.svg" alt="">
            </div>
        </div>

        <p class="site-loader__copyright" aria-hidden="true">
            © 2026 Gianluigi Grieco
        </p>
    </div>

    <div class="site" id="site">

        <header
            class="site-header"
            id="siteHeader"
        ></header>


        <main
            id="app"
            aria-live="polite"
        ></main>


        <footer
            class="site-footer"
            id="siteFooter"
        ></footer>

    </div>


    <noscript>
        <div class="noscript-message">
            Questo sito richiede JavaScript per funzionare correttamente.
        </div>
    </noscript>


    <script
        type="module"
        src="js/app.js"
    ></script>

</body>

</html>
