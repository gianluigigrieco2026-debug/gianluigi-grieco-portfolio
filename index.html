<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gianluigi Grieco — Graphic Designer, Fotografo e Shopify Partner</title>

    <meta
        name="description"
        content="Portfolio di Gianluigi Grieco, creativo indipendente specializzato in brand identity, graphic design, fotografia e creazione di siti ed e-commerce Shopify."
    >

    <meta
        name="author"
        content="Gianluigi Grieco"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <link
        rel="icon"
        href="assets/icons/favicon.svg"
        type="image/svg+xml"
    >

    <meta property="og:type" content="website">
    <meta property="og:title" content="Gianluigi Grieco — Graphic Designer, Fotografo e Shopify Partner">
    <meta property="og:description" content="Brand identity, graphic design, fotografia e creazione di siti ed e-commerce Shopify.">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Gianluigi Grieco — Graphic Designer, Fotografo e Shopify Partner">
    <meta name="twitter:description" content="Brand identity, graphic design, fotografia e creazione di siti ed e-commerce Shopify.">

    <link
        rel="stylesheet"
        href="css/app.css"
    >
</head>

<body>

    <div
        class="site-loader"
        id="siteLoader"
        role="status"
        aria-label="Caricamento del portfolio"
    >
        <div class="site-loader__signature" aria-hidden="true">
            <div class="site-loader__signature-reveal">
                <img src="assets/icons/loader-signature.svg" alt="">
            </div>
        </div>

        <p class="site-loader__copyright" aria-hidden="true">
            © 2026 Gianluigi Grieco
        </p>
    </div>

    <div class="site" id="site">

        <header
            class="site-header"
            id="siteHeader"
        ></header>


        <main
            id="app"
            aria-live="polite"
        ></main>


        <footer
            class="site-footer"
            id="siteFooter"
        ></footer>

    </div>


    <noscript>
        <div class="noscript-message">
            Questo sito richiede JavaScript per funzionare correttamente.
        </div>
    </noscript>


    <script
        type="module"
        src="js/app.js"
    ></script>

</body>

</html>
